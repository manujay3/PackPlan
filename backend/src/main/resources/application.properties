spring.application.name=packplan
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:packplan-local}
spring.neo4j.connection-timeout=3s
spring.neo4j.pool.connection-acquisition-timeout=3s
spring.neo4j.max-transaction-retry-time=3s
server.error.include-message=never
server.error.include-stacktrace=never
packplan.catalog.import-reviewed-data=${PACKPLAN_CATALOG_IMPORT_REVIEWED_DATA:false}
