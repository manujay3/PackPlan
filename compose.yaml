name: packplan
services:
  neo4j:
    image: neo4j:2026.08.1
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # Local demonstration credentials only.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-packplan-local}
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1;' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    volumes:
      - neo4j_data:/data
  backend:
    build: ./backend
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-packplan-local}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/database/status || exit 1"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    ports:
      - "127.0.0.1:8080:8080"
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  neo4j_data:
